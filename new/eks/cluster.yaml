apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-cluster-01
  region: ap-southeast-1

vpc:
  id: "vpc-xxx"
  subnets:
    public:
      apsoutheast1a:
        id: subnet-0465e4ede9874b669
      apsoutheast1b:
        id: subnet-069c7be4c68af1989
      apsoutheast1c:
        id: subnet-0a3ce135d8dd51407

managedNodeGroups:
  - name: ng-1-workers
    labels: { role: workers }
    instanceType: t2.micro
    desiredCapacity: 2
    maxPodsPerNode: 100
    minSize: 1
    maxSize: 4
    ssh: 
      allow: true 
      publicKeyName: eks-spore
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/eks-cluster-01: "owned"


  - name: ng-2-workers
    labels: { role: workers }
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 4
    maxPodsPerNode: 17
    ssh:
      allow: true
      publicKeyName: xxx
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/eks-cluster-01: "owned"
    updateConfig:
      maxUnavailable: 1

iam:
  withOIDC: true
  serviceRoleARN: arn:aws:iam::xxxx2:role/EKSClusterServiceRole
